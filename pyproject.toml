[project]
name = "chain"
version = "0.0.1"
description = "chAIn — authorized-pentest coverage-matrix + chaining tracker (safety core)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "pydantic>=2",
    "httpx>=0.27",
    "anyio",
    "mcp>=2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chain*"]

[tool.setuptools.package-data]
chain = ["static/*.html", "mcp/*.md"]
